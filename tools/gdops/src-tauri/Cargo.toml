[package]
name = "gdops"
version = "0.1.0"
description = "GD-OPS 游戏自动化指挥台 · 跨平台桌面壳"
edition = "2021"

[lib]
name = "gdops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布构建必须带 custom-protocol，否则 tauri 认为仍是开发态、去连 devUrl。
# 直接 cargo build --release 时请加 --features custom-protocol（tauri build 会自动带）。
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
